name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v2026.11.21 (leave empty for a build-only run)'
        required: false
        type: string
      publish:
        description: 'Publish a GitHub Release for the existing tag'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate version and source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      app-version: ${{ steps.version.outputs.app-version }}
      commit: ${{ steps.version.outputs.commit }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve existing tag or selected build ref
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          import sys
          sys.path.insert(0, "scripts")
          from calver import CalVer
          import subprocess

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          pushed_tag = os.environ['GITHUB_EVENT_NAME'] == 'push'
          tag = os.environ['GITHUB_REF_NAME'] if pushed_tag else os.environ.get('REQUESTED_TAG', '').strip()
          publish = pushed_tag or os.environ.get('REQUESTED_PUBLISH') == 'true'
          if publish and not tag:
              raise SystemExit('Publishing requires an existing version tag.')

          if tag:
              parsed = CalVer.parse(tag)
              if tag != f'v{parsed}':
                  raise SystemExit('Use a CalVer tag such as v2026.11.21 or v2026.11.21.1.')
              commit = git('rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}')
          else:
              commit = git('rev-parse', 'HEAD')
              with open('Resources/Info.plist', 'rb') as source:
                  info = plistlib.load(source)
              parsed = CalVer.parse(info['NonSleepReleaseVersion'])
          version, app_version = str(parsed), parsed.app_version
          prerelease = bool(parsed.modifier)

          values = {'tag': tag, 'version': version, 'app-version': app_version,
                    'commit': commit, 'publish': str(publish).lower(),
                    'prerelease': str(prerelease).lower()}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in values.items():
                  output.write(f'{key}={value}\n')
          print(f'Source: {commit}; version: {version}; publish: {publish}')
          PY

  build:
    name: Build and test (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/module-cache
      SWIFTPM_MODULECACHE_OVERRIDE: ${{ github.workspace }}/.build/module-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Check build environment
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          xcodebuild -version
          swift --version
      - name: Run tests
        run: |
          python3 -m unittest discover -s scripts/tests -v
          swift test --disable-sandbox \
            --cache-path "$PWD/.build/cache" \
            --config-path "$PWD/.build/config" \
            --security-path "$PWD/.build/security"
      - name: Build app bundle
        env:
          NONSLEEP_APP_DIR: ${{ runner.temp }}/NonSleep.app
          NONSLEEP_VERSION: ${{ needs.prepare.outputs.version }}
          NONSLEEP_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build.sh
      - name: Verify and package
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          APP_VERSION: ${{ needs.prepare.outputs.app-version }}
          APP_DIR: ${{ runner.temp }}/NonSleep.app
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_DIR/Contents/Info.plist")" = "$APP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NonSleepReleaseVersion' "$APP_DIR/Contents/Info.plist")" = "$VERSION"
          for executable in NonSleep NonSleepHelper; do
            lipo "$APP_DIR/Contents/MacOS/$executable" -verify_arch "$ARCH"
            codesign --verify --strict "$APP_DIR/Contents/MacOS/$executable"
          done
          codesign --verify --deep --strict "$APP_DIR"
          mkdir -p dist
          archive="NonSleep-$VERSION-macos-$ARCH.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "dist/$archive"
          cd dist
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Store release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  sign-updates:
    name: Sign and verify update packages
    needs: [prepare, build]
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-*
          path: dist
          merge-multiple: true
      - name: Verify archives and fetch pinned Sparkle signing tools
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && shasum -a 256 --check ./*.sha256)
          mkdir -p "$RUNNER_TEMP/sparkle"
          curl --fail --location --retry 3 \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz \
            -o "$RUNNER_TEMP/sparkle.tar.xz"
          echo "1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 --check
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
      - name: Generate signed appcasts
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 scripts/generate_appcasts.py --version "$VERSION" --dist dist \
            --signer "$RUNNER_TEMP/sparkle/bin/sign_update"
          (cd dist && shasum -a 256 --check SHA256SUMS.txt)
      - name: Store complete release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/*.zip
            dist/appcast-*.xml
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: [prepare, sign-updates]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Download signed release package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Verify files and create release
        working-directory: dist
        run: |
          set -euo pipefail
          archives=(NonSleep-*-macos-*.zip)
          test "${#archives[@]}" -eq 2
          feeds=(appcast-*.xml)
          test "${#feeds[@]}" -eq 2
          sha256sum --check SHA256SUMS.txt

          current_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          test "$current_commit" = "$SOURCE_COMMIT"

          if existing="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$existing" != true ]]; then
              echo 'This release is already published. Use a new version tag.' >&2
              exit 1
            fi
          else
            cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Choose the ZIP for your Mac: `arm64` for Apple Silicon, `x86_64` for Intel.
          Extract `NonSleep.app` and move it to Applications. Requires macOS 14 or later.

          These builds use ad-hoc signing and are not notarized by Apple.
          Updates can be checked and installed from Settings → Updates.
          Update archives and appcasts are signed with Ed25519.
          SHA-256 checksums are provided in `SHA256SUMS.txt`.
          NOTES
            release_flags=()
            if [[ "$PRERELEASE" == true ]]; then
              release_flags+=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "NonSleep $RELEASE_TAG" --draft \
              --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md" \
              "${release_flags[@]}"
          fi

          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            "${archives[@]}" "${feeds[@]}" SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease="$PRERELEASE"
